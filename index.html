<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Capitole Énergie — Statistiques</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <style>
    :root{
      --bleu-capitole:#0C32FF;--rose-capitole:#E543DC;--jaune-capitole:#FFC14F;
      --noir-capitole:#232323;--blanc:#FFFFFF;--principale-bleu:#5020EA;
      --secondaire-bleu:#EDEDFF;--blanc-bloc:#F3F3F3;--bleu-hover:#99A9FF;
      --gris-contour:#E3E3E3;--gris-texte:#4D4D4D;
      --orange:#DF722F;--orange-light:#FFF4ED;--orange-border:#FBBF67;
      --vert:#096E3F;--vert-light:#E8F8ED;--vert-border:#BEE6D6;
      --rouge:#C43D00;--rouge-light:#FFF1F0;--rouge-border:#F3B09A;
      --brun:#5D4037;--brun-light:#EFEBE9;--brun-border:#D7CCC8;
      --radius:10px;--radius-lg:16px;
      --shadow-card:0 4px 24px rgba(80,32,234,0.06);
      --transition:all .3s cubic-bezier(.4,0,.2,1);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Poppins',sans-serif;background:var(--secondaire-bleu);color:var(--noir-capitole);min-height:100vh}
    h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif}

    /* TOPBAR */
    .topbar{background:var(--blanc);border-bottom:1px solid var(--gris-contour);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
    .topbar-left{display:flex;align-items:center;gap:14px}
    .topbar-brand{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:700}
    .topbar-badge{background:var(--secondaire-bleu);color:var(--principale-bleu);font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px}
    .topbar-right{display:flex;align-items:center;gap:12px}
    .topbar-email{font-size:13px;color:var(--gris-texte)}

    /* BUTTONS */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border:none;border-radius:var(--radius);font-family:'Poppins',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:var(--transition);text-decoration:none}
    .btn .material-icons-round{font-size:17px}
    .btn-primary{background:var(--principale-bleu);color:var(--blanc)}
    .btn-primary:hover{background:var(--bleu-hover)}
    .btn-secondary{background:var(--secondaire-bleu);color:var(--principale-bleu)}
    .btn-ghost{background:transparent;color:var(--gris-texte);padding:8px 12px}
    .btn-ghost:hover{color:var(--principale-bleu);background:var(--secondaire-bleu)}
    .btn-success{background:var(--vert-light);color:var(--vert)}
    .btn-success:hover{background:var(--vert-border)}
    .btn-sm{padding:7px 14px;font-size:12px}
    .btn-sm .material-icons-round{font-size:15px}
    .btn:disabled{opacity:.5;cursor:not-allowed}

    /* LAYOUT */
    .shell{display:grid;grid-template-columns:260px 1fr;gap:20px;max-width:1500px;margin:0 auto;padding:22px}
    .card{background:var(--blanc);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow-card);margin-bottom:16px}
    .card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
    .card-header h2{font-size:17px}
    .card-header p{font-size:12.5px;color:var(--gris-texte);margin-top:3px}

    /* SIDEBAR */
    .side{background:var(--blanc);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-card);align-self:start;position:sticky;top:82px}
    .side-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:#A8A8A8;margin:4px 0 12px}
    .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);cursor:pointer;transition:var(--transition);font-size:13px;font-weight:500;margin-bottom:4px}
    .nav-item:hover{background:var(--secondaire-bleu)}
    .nav-item.active{background:var(--principale-bleu);color:var(--blanc)}
    .nav-item .material-icons-round{font-size:19px}
    .nav-item .scope{margin-left:auto;font-size:9.5px;font-weight:700;text-transform:uppercase;opacity:.75}

    /* FILTRES */
    .filter-bar{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-end}
    .filter-group{display:flex;flex-direction:column;gap:6px}
    .filter-group label{font-size:12px;font-weight:600;color:var(--gris-texte)}
    .filter-group select{padding:8px 14px;border:1.5px solid var(--gris-contour);border-radius:var(--radius);font-family:'Poppins',sans-serif;font-size:13px;background:var(--blanc);outline:none;cursor:pointer;min-width:240px}
    .filter-group select:focus{border-color:var(--principale-bleu);box-shadow:0 0 0 3px rgba(80,32,234,.1)}
    .period{display:flex;gap:8px;flex-wrap:wrap}
    .period-btn{padding:7px 16px;border-radius:20px;border:1.5px solid var(--gris-contour);background:var(--blanc);color:var(--gris-texte);font-family:'Poppins',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:var(--transition)}
    .period-btn:hover{border-color:var(--principale-bleu);color:var(--principale-bleu)}
    .period-btn.active{background:var(--principale-bleu);color:#fff;border-color:var(--principale-bleu)}

    /* KPI */
    .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
    .kpi{background:var(--blanc-bloc);border-radius:var(--radius);padding:16px;text-align:center}
    .kpi:first-child{background:var(--secondaire-bleu)}
    .kpi-num{font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:700;line-height:1.1}
    .kpi-num.green{color:var(--vert)}.kpi-num.orange{color:var(--orange)}.kpi-num.blue{color:var(--principale-bleu)}
    .kpi-label{font-size:11.5px;color:var(--gris-texte);margin-top:5px}

    /* TABLES */
    .tbl-wrap{overflow-x:auto}
    table.tbl{width:100%;border-collapse:collapse}
    table.tbl th{text-align:left;font-size:11px;font-weight:600;color:var(--gris-texte);padding:10px 14px;border-bottom:2px solid var(--gris-contour);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
    table.tbl td{padding:11px 14px;border-bottom:1px solid #F0F0F0;font-size:12.5px;vertical-align:middle}
    table.tbl tr:last-child td{border-bottom:none}
    table.tbl tbody tr:hover td{background:var(--secondaire-bleu)}
    .badge{display:inline-flex;align-items:center;justify-content:center;background:var(--secondaire-bleu);color:var(--principale-bleu);font-weight:700;font-size:12.5px;padding:3px 12px;border-radius:20px;min-width:36px}
    .chip{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10.5px;font-weight:600;margin:1px;background:var(--blanc-bloc);color:var(--gris-texte);border:1px solid var(--gris-contour)}
    .chip.green{background:var(--vert-light);color:var(--vert);border-color:var(--vert-border)}
    .chip.blue{background:var(--secondaire-bleu);color:var(--principale-bleu);border-color:#CCD4FF}
    .chip.orange{background:var(--orange-light);color:var(--orange);border-color:var(--orange-border)}
    .chip.brown{background:var(--brun-light);color:var(--brun);border-color:var(--brun-border)}
    .chip.grey{background:#F3F3F3;color:#666;border-color:#E3E3E3}
    .bar-wrap{display:flex;align-items:center;gap:10px;min-width:150px}
    .bar-bg{flex:1;height:8px;background:var(--gris-contour);border-radius:4px;overflow:hidden}
    .bar-fill{height:8px;background:var(--principale-bleu);border-radius:4px;transition:width .6s ease}
    .muted{color:#A8A8A8;font-size:11px}
    .ref{font-weight:700;color:var(--principale-bleu)}
    .note{margin-top:5px;font-size:11.5px;color:#666;background:#F8F7FF;border-radius:4px;padding:3px 8px;border-left:2px solid #D8CEFF}
    .sub{font-family:'Bricolage Grotesque',sans-serif;font-size:14.5px;margin:0 0 12px}
    .sub-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 12px}
    .sub-row:first-child{margin-top:0}

    /* ETATS */
    .center{text-align:center;padding:44px 20px;color:#A8A8A8}
    .center .material-icons-round{font-size:46px;display:block;margin-bottom:10px;opacity:.45}
    .msg{padding:12px 16px;border-radius:var(--radius);font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;margin-bottom:14px}
    .msg.error{background:var(--rouge-light);color:var(--rouge);border:1px solid var(--rouge-border)}
    .msg.warn{background:var(--orange-light);color:var(--orange);border:1px solid var(--orange-border)}
    .spin{animation:spin 1s linear infinite;display:inline-block}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fade{animation:fadeUp .35s ease-out}
    input.search{padding:8px 14px;border:1.5px solid var(--gris-contour);border-radius:var(--radius);font-family:'Poppins',sans-serif;font-size:12.5px;outline:none;min-width:260px}
    input.search:focus{border-color:var(--principale-bleu)}

    /* GATE */
    .gate{max-width:460px;margin:12vh auto;background:var(--blanc);border-radius:var(--radius-lg);padding:38px;text-align:center;box-shadow:var(--shadow-card)}
    .gate .material-icons-round{font-size:52px;color:var(--principale-bleu);margin-bottom:14px}
    .gate h1{font-size:21px;margin-bottom:10px}
    .gate p{font-size:13.5px;color:var(--gris-texte);line-height:1.6;margin-bottom:22px}

    /* ADMIN */
    .matrix td,.matrix th{text-align:center}
    .matrix td:first-child,.matrix th:first-child{text-align:left}
    .matrix select{padding:4px 8px;font-size:11px;border:1px solid var(--gris-contour);border-radius:6px;font-family:'Poppins',sans-serif;background:#fff}
    .switch{width:18px;height:18px;accent-color:var(--principale-bleu);cursor:pointer}

    @media(max-width:1000px){.shell{grid-template-columns:1fr}.side{position:static}}
  </style>
</head>
<body>

  <!-- ÉCRAN D'ACCÈS -->
  <div id="gate" class="gate" style="display:none">
    <span class="material-icons-round" id="gateIcon">query_stats</span>
    <h1 id="gateTitle">Statistiques Capitole</h1>
    <p id="gateText">Connexion en cours…</p>
    <a class="btn btn-primary" id="gateBtn" href="#" style="display:none">
      <span class="material-icons-round">arrow_forward</span> Retourner sur le hub
    </a>
  </div>

  <!-- APPLICATION -->
  <div id="app" style="display:none">
    <div class="topbar">
      <div class="topbar-left">
        <span class="topbar-brand">Capitole Énergie</span>
        <span class="topbar-badge">Statistiques</span>
        <span class="topbar-badge" id="roleBadge" style="background:var(--vert-light);color:var(--vert)"></span>
      </div>
      <div class="topbar-right">
        <span class="topbar-email" id="userEmail"></span>
        <button class="btn btn-ghost btn-sm" onclick="refreshAll()" title="Actualiser">
          <span class="material-icons-round" id="refreshIcon">refresh</span>
        </button>
        <a class="btn btn-secondary btn-sm" id="hubLink" href="#">
          <span class="material-icons-round">apps</span> Hub
        </a>
      </div>
    </div>

    <div class="shell">
      <!-- NAV -->
      <div class="side">
        <div class="side-title">Statistiques</div>
        <div id="nav"></div>
        <div id="adminNav" style="display:none;border-top:1px solid var(--gris-contour);margin-top:12px;padding-top:12px">
          <div class="side-title">Administration</div>
          <div class="nav-item" data-view="admin" onclick="selectAdmin()">
            <span class="material-icons-round">tune</span> Accès par rôle
          </div>
        </div>
      </div>

      <!-- CONTENU -->
      <div>
        <div class="card" id="filterCard">
          <div class="card-header">
            <div>
              <h2>Filtres</h2>
              <p id="filterHint">S'appliquent à la statistique affichée</p>
            </div>
            <button class="btn btn-success btn-sm" id="exportBtn" onclick="exportExcel()">
              <span class="material-icons-round">download</span> Export Excel
            </button>
          </div>
          <div class="filter-bar">
            <div class="filter-group">
              <label>Période</label>
              <div class="period" id="periods">
                <button class="period-btn" data-days="7">7 jours</button>
                <button class="period-btn" data-days="30">30 jours</button>
                <button class="period-btn" data-days="90">3 mois</button>
                <button class="period-btn" data-days="365">12 mois</button>
                <button class="period-btn" data-days="0">Tout</button>
              </div>
            </div>
            <div class="filter-group">
              <label>Utilisateur</label>
              <select id="userFilter"></select>
            </div>
          </div>
        </div>

        <div id="content"></div>
      </div>
    </div>
  </div>

<script>
// ── ÉTAT ────────────────────────────────────────────────────
var HUB_URL = '';
const STATE = {
  config: null,
  definitions: [],
  current: null,      // clé de définition affichée
  view: 'stats',      // 'stats' | 'admin'
  days: 7,
  email: '',
  result: null,
  detailLimit: 200,
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => d ? new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
const el = id => document.getElementById(id);

// ── DÉMARRAGE ───────────────────────────────────────────────
(async function boot(){
  const params = new URLSearchParams(location.search);
  const token = params.get('token');

  if (token) {
    showGate('Connexion en cours…', 'sync', true);
    const res = await fetch('/api/session', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token })
    });
    const r = await res.json().catch(() => ({}));
    history.replaceState({}, '', location.pathname);
    if (!res.ok) return showGate(r.error || 'Accès refusé.', 'lock', false, true);
  }

  const ok = await loadConfig();
  if (!ok) return;
  el('gate').style.display = 'none';
  el('app').style.display = 'block';
  await loadCurrent();
})();

function showGate(text, icon='query_stats', spinning=false, showBtn=false){
  el('app').style.display = 'none';
  el('gate').style.display = 'block';
  el('gateText').textContent = text;
  const i = el('gateIcon');
  i.textContent = icon;
  i.className = 'material-icons-round' + (spinning ? ' spin' : '');
  const btn = el('gateBtn');
  btn.style.display = showBtn ? 'inline-flex' : 'none';
  btn.href = HUB_URL || '#';
}

async function loadConfig(){
  const res = await fetch('/api/config');
  const r = await res.json().catch(() => ({}));
  if (!res.ok) {
    showGate(r.error || 'Ouvre les statistiques depuis le hub Capitole pour t\'authentifier.', 'lock', false, false);
    return false;
  }
  STATE.config = r;
  STATE.definitions = r.definitions;
  HUB_URL = r.hub_url || '';
  el('userEmail').textContent = r.user.email;
  el('roleBadge').textContent = r.user.is_admin ? 'Admin' : (roleLabel(r.user.stats_role) || '—');
  el('hubLink').href = HUB_URL || '/';
  el('adminNav').style.display = r.user.is_admin ? 'block' : 'none';

  // Nav
  el('nav').innerHTML = STATE.definitions.length
    ? STATE.definitions.map(d => `
        <div class="nav-item" data-key="${esc(d.key)}" onclick="selectDefinition('${esc(d.key)}')">
          <span class="material-icons-round">${esc(d.icon || 'query_stats')}</span>
          <span>${esc(d.label)}</span>
          ${d.scope !== 'all' ? `<span class="scope">${d.scope === 'self' ? 'perso' : 'cellule'}</span>` : ''}
        </div>`).join('')
    : '<div class="muted" style="padding:8px 12px">Aucune statistique autorisée</div>';

  // Filtre utilisateur
  const sel = el('userFilter');
  sel.innerHTML = '<option value="">— Tous les utilisateurs —</option>' +
    (r.users || []).map(u => `<option value="${esc(u)}">${esc(u)}</option>`).join('');
  sel.onchange = () => { STATE.email = sel.value; loadCurrent(); };

  // Périodes
  [...el('periods').children].forEach(b => {
    b.classList.toggle('active', Number(b.dataset.days) === STATE.days);
    b.onclick = () => {
      STATE.days = Number(b.dataset.days);
      [...el('periods').children].forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      loadCurrent();
    };
  });

  STATE.current = STATE.definitions[0]?.key || null;
  return true;
}

function roleLabel(key){
  const roles = STATE.config?.admin?.roles;
  if (roles) return roles.find(r => r.key === key)?.label || key;
  return ({direction:'Direction',resp_commercial:'Resp Commercial',resp_adv:'Resp ADV',
           resp_partenaire:'Resp Partenaire',resp_pricing:'Resp Pricing'})[key] || key;
}

// ── NAVIGATION ──────────────────────────────────────────────
function markNav(){
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const sel = STATE.view === 'admin'
    ? document.querySelector('.nav-item[data-view="admin"]')
    : document.querySelector(`.nav-item[data-key="${STATE.current}"]`);
  sel?.classList.add('active');
}

function selectDefinition(key){
  STATE.view = 'stats'; STATE.current = key; STATE.detailLimit = 200;
  el('filterCard').style.display = 'block';
  loadCurrent();
}

function selectAdmin(){
  STATE.view = 'admin';
  el('filterCard').style.display = 'none';
  markNav();
  renderAdmin();
}

function refreshAll(){
  const i = el('refreshIcon');
  i.classList.add('spin');
  (STATE.view === 'admin' ? Promise.resolve(renderAdmin()) : loadCurrent())
    .finally(() => i.classList.remove('spin'));
}

// ── CHARGEMENT D'UNE STATISTIQUE ────────────────────────────
async function loadCurrent(){
  markNav();
  const c = el('content');
  if (STATE.view === 'admin') return renderAdmin();
  if (!STATE.current) {
    c.innerHTML = `<div class="card"><div class="center"><span class="material-icons-round">lock</span>
      <p>Aucune statistique n'est ouverte à ton rôle.<br>Contacte un administrateur du hub.</p></div></div>`;
    return;
  }

  c.innerHTML = `<div class="card"><div class="center">
    <span class="material-icons-round spin">sync</span><p>Chargement…</p></div></div>`;

  try {
    const res = await fetch('/api/stats', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ definition: STATE.current, days: STATE.days, email: STATE.email || null })
    });
    const r = await res.json();
    if (!res.ok) throw new Error(r.error || 'Erreur inconnue');
    STATE.result = r.result;
    render();
  } catch (e) {
    c.innerHTML = `<div class="card"><div class="msg error">
      <span class="material-icons-round">error</span>${esc(e.message)}</div></div>`;
  }
}

// ── RENDU ───────────────────────────────────────────────────
function render(){
  const r = STATE.result;
  const def = STATE.definitions.find(d => d.key === r.key);
  let html = `<div class="card fade">
    <div class="card-header">
      <div><h2>${esc(r.label)}</h2><p>${esc(r.description || '')}</p></div>
      <span class="muted">Période : ${periodLabel()} · ${r.total} ligne(s)</span>
    </div>`;

  if (r.truncated) html += `<div class="msg warn"><span class="material-icons-round">warning</span>
    Volume très élevé : les résultats sont plafonnés. Restreins la période pour des chiffres exacts.</div>`;

  if (!r.total) {
    html += `<div class="center"><span class="material-icons-round">${esc(r.icon || 'query_stats')}</span>
      <p>Aucune activité enregistrée sur cette période.</p></div></div>`;
    el('content').innerHTML = html;
    return;
  }

  html += `<div class="kpis">${r.kpis.map(k => `
    <div class="kpi">
      <div class="kpi-num ${k.color ? esc(k.color) : ''}">${esc(k.value)}${esc(k.suffix || '')}</div>
      <div class="kpi-label">${esc(k.label)}</div>
    </div>`).join('')}</div>`;

  r.breakdowns.forEach(bd => { html += renderBreakdown(bd, r); });
  html += '</div>';
  html += renderDetailCard(r);

  el('content').innerHTML = html;
  wireDetail();
}

function periodLabel(){
  return ({0:'tout l\'historique',7:'7 jours',30:'30 jours',90:'3 mois',365:'12 mois'})[STATE.days];
}

function renderBreakdown(bd, r){
  if (!bd.rows.length) return '';
  const catMap = Object.fromEntries((r.categories || []).map(c => [c.key, c]));
  let h = `<div class="sub-row">
      <h3 class="sub">${esc(bd.label)}</h3>
      <span class="muted">${bd.total_groups} valeur(s)${bd.truncated_at ? ` — top ${bd.rows.length} affiché` : ''}</span>
    </div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr>
      <th style="width:36px">#</th><th>${esc(bd.header)}</th>
      ${bd.columns.map(c => `<th>${esc(c.label)}</th>`).join('')}
    </tr></thead><tbody>`;

  bd.rows.forEach((row, i) => {
    h += `<tr><td class="muted">${i + 1}</td><td><strong>${esc(row.key)}</strong></td>`;
    bd.columns.forEach(col => {
      const cell = row.cells[col.id] || {};
      h += '<td>' + renderCell(col, cell, catMap) + '</td>';
    });
    h += '</tr>';
  });
  return h + '</tbody></table></div>';
}

function renderCell(col, cell, catMap){
  switch (col.type) {
    case 'badge': return `<span class="badge">${cell.value ?? 0}</span>`;
    case 'bar': return `<div class="bar-wrap"><div class="bar-bg">
        <div class="bar-fill" style="width:${cell.width ?? 0}%"></div></div>
        <span class="muted" style="width:34px;text-align:right">${cell.value ?? 0}%</span></div>`;
    case 'datetime': return `<span class="muted">${fmtDate(cell.value)}</span>`;
    case 'number': return `<span>${cell.value ?? 0}</span>`;
    case 'rate': return cell.value === null || cell.value === undefined
      ? '<span class="muted">—</span>'
      : `<strong>${cell.value}%</strong>`;
    case 'categories': return Object.entries(cell.value || {}).map(([k, n]) => {
        const c = catMap[k];
        return `<span class="chip ${esc(c?.color || 'grey')}">${esc(c?.label || k)} (${n})</span>`;
      }).join('') || '<span class="muted">—</span>';
    case 'chips': return (cell.value || []).slice(0, 8)
        .map(c => `<span class="chip">${esc(c.label)} (${c.count})</span>`).join('') || '<span class="muted">—</span>';
    default: return esc(cell.value ?? '');
  }
}

function renderDetailCard(r){
  const cols = r.detail.columns;
  return `<div class="card fade">
    <div class="card-header">
      <div><h2>Détail</h2><p>${r.detail.rows.length} ligne(s) — recherche et export disponibles</p></div>
      <input class="search" id="detailSearch" placeholder="Rechercher…">
    </div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr>${cols.map(c => `<th>${esc(c.label)}</th>`).join('')}</tr></thead>
      <tbody id="detailBody"></tbody>
    </table></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px">
      <span class="muted" id="detailCount"></span>
      <button class="btn btn-ghost btn-sm" id="moreBtn" onclick="STATE.detailLimit+=200;wireDetail(true)">
        <span class="material-icons-round">expand_more</span> Afficher plus
      </button>
    </div>
  </div>`;
}

function wireDetail(keepQuery){
  const input = el('detailSearch');
  if (!input) return;
  if (!keepQuery) input.oninput = () => { STATE.detailLimit = 200; paintDetail(input.value); };
  paintDetail(input.value);
}

function paintDetail(query){
  const r = STATE.result;
  const cols = r.detail.columns;
  const q = (query || '').toLowerCase().trim();
  const rows = q ? r.detail.rows.filter(row => row.q.includes(q)) : r.detail.rows;
  const shown = rows.slice(0, STATE.detailLimit);
  const catMap = Object.fromEntries((r.categories || []).map(c => [c.key, c]));

  el('detailBody').innerHTML = shown.length ? shown.map(row => '<tr>' + row.values.map((v, i) => {
    const col = cols[i];
    if (col.type === 'datetime') return `<td class="muted">${fmtDate(v.display)}</td>`;
    if (col.type === 'category') return `<td><span class="chip ${esc(v.color || 'grey')}">${esc(v.display)}</span></td>`;
    if (col.type === 'chip') return `<td>${v.display ? `<span class="chip">${esc(v.display)}</span>` : '<span class="muted">—</span>'}</td>`;
    if (col.type === 'list') return `<td>${(v.list || []).map(x => `<span class="chip blue">${esc(x)}</span>`).join('') || '<span class="muted">—</span>'}</td>`;
    if (col.type === 'ref') return `<td>${v.display ? `<span class="ref">📁 ${esc(v.display)}</span>` : '<span class="muted">—</span>'}</td>`;
    if (col.type === 'note') return `<td>${v.display ? `<div class="note">💬 ${esc(v.display)}</div>` : '<span class="muted">—</span>'}</td>`;
    return `<td>${v.display ? esc(v.display) : '<span class="muted">—</span>'}</td>`;
  }).join('') + '</tr>').join('')
    : `<tr><td colspan="${cols.length}" class="center" style="padding:24px">Aucune ligne ne correspond.</td></tr>`;

  el('detailCount').textContent = `${shown.length} / ${rows.length} ligne(s) affichée(s)`;
  el('moreBtn').style.display = shown.length < rows.length ? 'inline-flex' : 'none';
}

// ── EXPORT EXCEL ────────────────────────────────────────────
async function exportExcel(){
  const btn = el('exportBtn');
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="material-icons-round spin">sync</span> Export…';
  try {
    const res = await fetch('/api/export', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ days: STATE.days, email: STATE.email || null })
    });
    const r = await res.json();
    if (!res.ok) throw new Error(r.error || 'Erreur export');

    const wb = XLSX.utils.book_new();
    const used = new Set();
    r.sheets.forEach(sheet => {
      let name = sheet.name.replace(/[\\/?*\[\]:]/g, '-').slice(0, 31) || 'Feuille';
      let n = 2;
      while (used.has(name)) name = `${name.slice(0, 28)}_${n++}`;
      used.add(name);
      const aoa = sheet.rows.length ? [sheet.headers, ...sheet.rows] : [['Info'], ['Aucune donnée sur cette période']];
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), name);
    });
    const stamp = new Date().toLocaleDateString('fr-FR').replace(/\//g, '-');
    XLSX.writeFile(wb, `stats-capitole-${stamp}.xlsx`);
  } catch (e) {
    alert('Export impossible : ' + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

// ── ADMIN : matrice des accès ───────────────────────────────
function renderAdmin(){
  const a = STATE.config?.admin;
  if (!a) return;
  const key = (r, d) => `${r}|${d}`;
  const map = new Map(a.access.map(x => [key(x.role_key, x.definition_key), x.scope]));

  el('content').innerHTML = `<div class="card fade">
    <div class="card-header">
      <div><h2>Accès aux statistiques par rôle</h2>
      <p>Coche pour ouvrir une statistique à un rôle. Le périmètre limite les lignes visibles : tout, la cellule de l'utilisateur, ou ses propres lignes. Les administrateurs du hub voient tout.</p></div>
    </div>
    <div class="tbl-wrap"><table class="tbl matrix">
      <thead><tr><th style="text-align:left">Statistique</th>
        ${a.roles.map(r => `<th>${esc(r.label)}</th>`).join('')}
      </tr></thead>
      <tbody>${a.definitions.map(d => `
        <tr>
          <td><strong>${esc(d.label)}</strong>${d.active ? '' : ' <span class="chip grey">inactive</span>'}<br>
              <span class="muted">${esc(d.key)}</span></td>
          ${a.roles.map(r => {
            const scope = map.get(key(r.key, d.key));
            const on = scope !== undefined;
            return `<td>
              <input type="checkbox" class="switch" ${on ? 'checked' : ''}
                onchange="saveAccess('${esc(r.key)}','${esc(d.key)}',this.checked,this)">
              <br>
              <select ${on ? '' : 'disabled'} onchange="saveAccess('${esc(r.key)}','${esc(d.key)}',true,this,this.value)">
                <option value="all"     ${scope === 'all'     ? 'selected' : ''}>Tout</option>
                <option value="cellule" ${scope === 'cellule' ? 'selected' : ''}>Sa cellule</option>
                <option value="self"    ${scope === 'self'    ? 'selected' : ''}>Lui-même</option>
              </select>
            </td>`;
          }).join('')}
        </tr>`).join('')}
      </tbody>
    </table></div>
    <p class="muted" style="margin-top:16px">Le rôle de chaque collaborateur se règle dans le hub, onglet Utilisateurs.</p>
  </div>`;
}

async function saveAccess(roleKey, defKey, enabled, node, scope){
  const row = node.closest('td');
  const box = row.querySelector('input');
  const sel = row.querySelector('select');
  const finalScope = scope || sel.value || 'all';
  node.disabled = true;
  try {
    const res = await fetch('/api/access', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ role_key: roleKey, definition_key: defKey, enabled, scope: finalScope })
    });
    const r = await res.json();
    if (!res.ok) throw new Error(r.error || 'Erreur');

    // Miroir local pour éviter un rechargement complet
    const acc = STATE.config.admin.access;
    const idx = acc.findIndex(x => x.role_key === roleKey && x.definition_key === defKey);
    if (enabled) {
      if (idx >= 0) acc[idx].scope = finalScope;
      else acc.push({ role_key: roleKey, definition_key: defKey, scope: finalScope });
    } else if (idx >= 0) acc.splice(idx, 1);

    sel.disabled = !enabled;
    box.checked = enabled;
    row.style.background = '#E8F8ED';
    setTimeout(() => { row.style.background = ''; }, 900);
  } catch (e) {
    alert('Enregistrement impossible : ' + e.message);
    box.checked = !enabled;
  } finally {
    node.disabled = false;
  }
}
</script>
